<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- App-icon source == the PWA icon (public/icon-512.png), so the native app and the
       home-screen PWA show the same icon: GymBro's rounded mango dumbbell on dusk indigo.
       The glyph stays inside the maskable safe zone (a circle of 40% radius).
       Generate platform icons + splash via `npx @capacitor/assets generate` — docs/MOBILE.md. -->
  <rect width="512" height="512" fill="#15122a"/>
  <g fill="#ffb23e">
    <rect x="96" y="238" width="320" height="36" rx="18"/>
    <rect x="84" y="196" width="40" height="120" rx="20"/>
    <rect x="132" y="160" width="56" height="192" rx="28"/>
    <rect x="324" y="160" width="56" height="192" rx="28"/>
    <rect x="388" y="196" width="40" height="120" rx="20"/>
  </g>
</svg>
